  <script>

  // OCHE is deliberately self-contained. No requests, dependencies, or build step.
  const STORAGE_KEY='oche.301.v1';
  const icons={

  const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.board}</svg>`;
  const $=(selector)=>document.querySelector(selector);
  const esc=(value)=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
  const initials=name=>name.trim().split(/\s+/).slice(0,2).map(n=>Array.from(n)[0]).join('').toUpperCase();
  const dateLabel=value=>new Date(value).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  let data,tab='match',toastTimer,storageOK=true,pendingImport=null,precisionMultiplier='S',precisionOpen=false,boardFocus='T20',fxTimer,audioContext,nextPlayerTimer;
  const singles=Array.from({length:20},(_,i)=>({value:i+1,label:`S${i+1}`,double:false}));
  const doubles=Array.from({length:20},(_,i)=>({value:(i+1)*2,label:`D${i+1}`,double:true}));
  const trebles=Array.from({length:20},(_,i)=>({value:(i+1)*3,label:`T${i+1}`,double:false})).reverse();
  const allHits=[...trebles,...singles.slice().reverse(),...doubles.slice().reverse(),{value:25,label:'25',double:false},{value:50,label:'BULL',double:true}];
  const hitValues=[...new Set([0,...allHits.map(h=>h.value)])];
  const possible=[new Set([0])];
  for(let n=1;n<=3;n++){possible[n]=new Set();for(const a of possible[n-1])for(const b of hitValues)possible[n].add(a+b);}
  const preferredDoubles=[16,20,8,12,10,18,6,4,14,2,15,5,9,7,3,1,19,17,13,11].map(n=>doubles[n-1]);
  const finishCache=new Map();
  function checkout(score,out,maxDarts=3){
    const key=`${score}/${out}/${maxDarts}`;if(finishCache.has(key))return finishCache.get(key);
    const finishes=out==='double'?[...preferredDoubles,{value:50,label:'BULL',double:true}]:[...preferredDoubles,...allHits];
    let result=null;
    for(let n=1;n<=maxDarts&&!result;n++){
      function search(left,remaining,path){
        if(remaining===1){const f=finishes.find(h=>h.value===left);return f?[...path,f]:null;}
        for(const hit of allHits){if(left-hit.value<1||(out==='double'&&left-hit.value<2))continue;const found=search(left-hit.value,remaining-1,[...path,hit]);if(found)return found;}
        return null;
      }
      result=search(score,n,[]);
    }
    finishCache.set(key,result);return result;
  }

  const avatarOptions={
    skin:['Porcelain','Sand','Honey','Caramel','Umber','Ebony'],
    background:['Emerald','Sky','Violet','Ocean','Berry','Indigo','Teal','Slate'],
    face:['Round','Oval','Square'],
    emotion:['Happy','Calm','Wink','Excited','Focused','Disappointed','Crying'],
    hair:['Crop','Side part','Curls','Long','Bald','Spikes'],
    hairColor:['Midnight','Chocolate','Chestnut','Gold','Silver','Pink'],
    accessory:['None','Glasses','Sunglasses','Earring','Headband'],

  const avatarLabels={skin:'Skin tone',background:'Background',face:'Face shape',emotion:'Expression',hair:'Hair style',hairColor:'Hair color',accessory:'Accessory',clothing:'Clothing',clothingColor:'Clothing color'};
  const avatarColors={skin:['#f7d9bd','#eac09a','#dca06b','#bc7e53','#8b563b','#593b30'],background:['#24976c','#328cce','#8254c7','#237da0','#b04488','#5c62bd','#208f91','#647991'],hairColor:['#232735','#4b332d','#8d4b32','#e4b85e','#d8dfe5','#d978a1'],clothingColor:['#c4f46b','#458fbb','#9577d4','#df7868','#e8dec6','#38465b']};
  let avatarDraft=null;
  function validAvatar(a){return !!a&&typeof a==='object'&&!Array.isArray(a)&&Object.keys(avatarOptions).every(k=>Number.isInteger(a[k])&&a[k]>=0&&a[k]<avatarOptions[k].length);}
  function defaultAvatar(seed){let n=2166136261;for(const ch of seed)n=Math.imul(n^ch.charCodeAt(0),16777619);return Object.fromEntries(Object.entries(avatarOptions).map(([k,v])=>{n^=n<<13;n^=n>>>17;n^=n<<5;return [k,(n>>>0)%v.length];}));}
  function uniqueAvatar(seed,used){let a,i=0;do{a=defaultAvatar(seed+':'+i++);}while(used.has(JSON.stringify(a)));return a;}
  function ensureAvatars(value){
    const known=new Map(),used=new Set();
    for(const p of [...value.players,...value.matches.flatMap(m=>m.players)]){

    return value;
  }
  function avatarBackground(a){
    const rgb=hex=>[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
    const luminance=channels=>channels.map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4;}).reduce((sum,v,i)=>sum+v*[.2126,.7152,.0722][i],0);
    const base=rgb(avatarColors.background[a.background]);
    const tones=[luminance(rgb(avatarColors.skin[a.skin]))];

  function addQuickPlayer(){const field=$('#quick-player-name'),name=field.value.trim();if(!name)return setupError('Give your player a name.');if(data.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))return setupError('That player already exists. Select them above.');const p={id:uid(),name};data.players.push(p);if(selectedPlayers.length<8)selectedPlayers.push(p.id);field.value='';$('#setup-error').hidden=true;save();renderChoices();}
  function startMatch(){if(!selectedPlayers.length||selectedPlayers.length>8)return setupError('Choose between 1 and 8 players.');const old=current();if((old.visits.length||pendingHits(old).length)&&derive(old).winner===null)old.abandoned=true;if(!old.visits.length&&!pendingHits(old).length)data.matches=data.matches.filter(m=>m.id!==old.id);const match=makeMatch(selectedPlayers.map(id=>data.players.find(p=>p.id===id)),$('#out-rule').value,Number($('#best-of').value));data.matches.push(match);data.currentId=match.id;precisionMultiplier='S';tab='match';save();closeDialog();render();toast('Match on. Good darts.');}
  function playerDialog(id){const p=data.players.find(p=>p.id===id);avatarDraft={...(p?.avatar||uniqueAvatar(uid(),new Set(data.players.map(p=>JSON.stringify(p.avatar)))))};openDialog(p?'Edit player':'Meet your next regular',`<p>${p?'Player statistics stay with this profile when you change the name.':'Add a name. We’ll keep their scores and statistics here.'}</p><form id="player-form" data-id="${esc(id||'')}"><div class="field"><label for="player-name">Player name</label><input class="text-input" id="player-name" maxlength="32" required autocomplete="off" value="${p?esc(p.name):''}" placeholder="e.g. Jamie" autofocus><p id="player-error" class="input-error" role="alert" hidden></p></div>${avatarEditor()}<div class="dialog-actions">${p?'<button type="button" class="btn danger" data-action="remove-player" data-id="'+esc(p.id)+'">Remove player</button>':'<button type="button" class="btn" data-action="close-dialog">Cancel</button>'}<button type="submit" class="btn primary">${p?'Save changes':'Add player'}</button></div></form>`);$('#player-name').focus();}
  function savePlayer(form){const name=$('#player-name').value.trim(),id=form.dataset.id;if(!name||data.players.some(p=>p.id!==id&&p.name.toLowerCase()===name.toLowerCase())){const error=$('#player-error');error.textContent=name?'A player with this name already exists.':'Enter a player name.';error.hidden=false;return;}const p=data.players.find(p=>p.id===id);if(p){p.name=name;p.avatar={...avatarDraft};const m=current();if(derive(m).winner===null)m.players.filter(p=>p.id===id).forEach(p=>p.name=name);}else data.players.push({id:uid(),name,avatar:{...avatarDraft}});save();closeDialog();render();toast(p?'Player updated.':'Player added.');}
  function removePlayerDialog(id){const p=data.players.find(p=>p.id===id);openDialog('Remove player?',`<p>Remove <strong>${esc(p.name)}</strong> from your player list? Their saved matches and current game will stay intact.</p><div class="dialog-actions"><button class="btn" data-action="close-dialog">Keep player</button><button class="btn danger" data-action="confirm-remove" data-id="${esc(id)}">Remove player</button></div>`);}
  function matchDetail(id){const m=data.matches.find(m=>m.id===id),g=derive(m);openDialog('Match record',`<p>${esc(dateLabel(m.startedAt))} · 301 · ${m.out==='double'?'Double':'Straight'} out · ${m.bestOf===1?'Single leg':`First to ${Math.ceil(m.bestOf/2)} legs`}</p><div class="dialog-info" style="margin-bottom:22px">${g.winner!==null?`${esc(m.players[g.winner].name)} won the match`:m.abandoned?'Ended early':'Match in progress'}<br>${m.players.map((p,i)=>`${esc(p.name)}: ${g.wins[i]} leg${g.wins[i]===1?'':'s'}`).join(' · ')}</div>${g.ranked?g.legResults.map(result=>rankingsMarkup(m,result)).join(''):''}${visitsTable(m,historyRows(m),Infinity)}<div class="dialog-actions"><button class="btn danger" data-action="delete-match" data-id="${esc(id)}">Delete game</button><button class="btn" data-action="close-dialog">Close</button>${id===data.currentId?'<button class="btn primary" data-action="return-match">Go to match</button>':''}</div>`);}

  function deleteMatchDialog(id){
    const m=data.matches.find(m=>m.id===id);if(!m)return;
    openDialog('Delete this game?',`<p><strong>${m.players.map(p=>esc(p.name)).join(' vs ')}</strong><br>${esc(dateLabel(m.startedAt))}</p><p>This removes the game's scores and its contribution to player statistics. Player profiles are kept. This cannot be undone.${id===data.currentId?' A fresh game with the same players and rules will be ready in the match room.':''}</p><div class="dialog-actions"><button class="btn" data-action="match-detail" data-id="${esc(id)}" autofocus>Keep game</button><button class="btn danger" data-action="confirm-delete-match" data-id="${esc(id)}">Delete game</button></div>`);
  }
  function deleteMatch(id){
    const m=data.matches.find(m=>m.id===id);if(!m)return;
    data.matches=data.matches.filter(game=>game.id!==id);
    if(id===data.currentId){
      const replacement=makeMatch(m.players,m.out,m.bestOf);
      data.matches.push(replacement);data.currentId=replacement.id;
      precisionMultiplier='S';precisionOpen=false;
    }
    save();closeDialog();render();toast('Game deleted.');announce('Game deleted. Player statistics updated.');
  }
  function rulesDialog(){openDialog('301. Now every dart counts.',`<p>Start at 301 and tap the segment each dart hit. The first player to reach exactly zero wins the leg.</p><ul class="rule-list"><li><strong>Tap the board:</strong> the wide areas score the number shown. The outer narrow ring doubles it; the inner narrow ring triples it. Outer bull scores 25; bullseye scores 50.</li><li><strong>Three darts per visit:</strong> each tap is saved immediately. After the third dart, select Next player. A miss scores zero and uses one dart. Tap the numbered outer rim, right-click anywhere on the board, or press M to record a miss. End visit early records only the darts you threw.</li><li><strong>Double out:</strong> finish on a double or the bullseye. A single or triple reaching zero is a bust. Straight out allows any scoring segment.</li><li><strong>Bust:</strong> going below zero or leaving 1 in double out resets the whole visit. The board pauses so you can pass to the next player.</li><li><strong>Undo dart:</strong> removes one dart and restores the turn, score, leg, and statistics, even after a bust, checkout, or win. Older total-entry records undo as a whole visit.</li><li><strong>Precision entry:</strong> use the larger number buttons below the board, with Single, Double, or Triple selected. On the board, arrow keys select segments; Enter or Space records the focused segment. Ctrl/⌘ Z undoes.</li><li><strong>Three to eight players:</strong> the first checkout wins the leg, then play continues for the remaining places. Checked-out players are skipped. The leg ends when only one player has not checked out. In a multi-leg match, the next leg starts after places are decided. The opening player rotates between legs.</li></ul><div class="dialog-info">Every dart, including an unfinished visit, is saved in this browser. Keep the HTML file in the same location. Export a backup before clearing browser data or switching devices. Averages use actual darts thrown; bust visits score zero. Arcade sound is optional, and reduced-motion settings are respected.</div><div class="dialog-actions"><button class="btn primary" data-action="close-dialog">Back to the board ${icon('arrow')}</button></div>`);}
  function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`oche-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported. Keep it for your next device.');}
  async function importData(file){if(!file)return;if(file.size>15000000)return toast('This file is too large. Choose an OCHE backup under 15 MB.');try{const value=JSON.parse(await file.text());if(!validData(value))throw new Error('Invalid backup');pendingImport=value;openDialog('Restore your backup?',`<p>This backup contains <strong>${value.players.length} players</strong> and <strong>${value.matches.length} matches</strong>. Restoring replaces the players and matches on this device.</p><div class="dialog-info">Export your current data first if you want to keep a separate copy.</div><div class="dialog-actions"><button class="btn" data-action="export">Export current</button><button class="btn primary" data-action="confirm-import">Restore backup</button></div>`);}catch(e){toast('That file is not a valid OCHE backup. Your data is unchanged.');}}
  document.addEventListener('contextmenu',event=>{
    if(tab!=='match'||$('#dialog').open||!event.target.closest('.interactive-board'))return;
    event.preventDefault();recordDart('MISS');
  });
  document.addEventListener('click',event=>{
    const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
    if(a==='tab'){tab=b.dataset.tab;render();}

    else if(a==='hit')recordDart(b.dataset.code,boardClickPosition(event,b));
    else if(a==='multiplier'){precisionMultiplier=b.dataset.value;precisionOpen=true;render();}
    else if(a==='next-player')nextPlayer();
    else if(a==='end-visit')endVisit();
    else if(a==='undo')undo();
    else if(a==='sound'){data.settings={...data.settings,sound:!data.settings?.sound};save();updateSound();if(data.settings.sound)playHitSound('double');}
    else if(a==='new-match'||a==='rematch')newMatchDialog(a==='rematch');
    else if(a==='close-dialog')closeDialog();
    else if(a==='shuffle-avatar'){avatarDraft=uniqueAvatar(uid(),new Set(data.players.map(p=>JSON.stringify(p.avatar))));updateAvatarEditor();}
    else if(a==='quick-add-player')addQuickPlayer();
    else if(a==='shuffle-order'){shufflePlayers();renderChoices();}
    else if(a==='add-player')playerDialog();
    else if(a==='edit-player')playerDialog(b.dataset.id);
    else if(a==='remove-player')removePlayerDialog(b.dataset.id);
    else if(a==='confirm-remove'){data.players=data.players.filter(p=>p.id!==b.dataset.id);save();closeDialog();render();toast('Player removed. Match records kept.');}
    else if(a==='achievements'){clearAchievementNotice();achievementDialog(b.dataset.id,b.dataset.reward,b.dataset.reward?'reward':'equipped');}
    else if(a==='preview-achievement'){achievementDialog(achievementPlayerId,b.dataset.reward,'reward');Array.from(document.querySelectorAll('[data-action="preview-achievement"]')).find(el=>el.dataset.reward===b.dataset.reward)?.focus();}
    else if(a==='achievement-preview-mode'){achievementDialog(achievementPlayerId,achievementPreview,b.dataset.mode);document.querySelector(`[data-action="achievement-preview-mode"][data-mode="${b.dataset.mode}"]`)?.focus({preventScroll:true});}
    else if(a==='equip-achievement')equipAchievement(b.dataset.reward);
    else if(a==='pin-achievement')pinAchievement(b.dataset.reward);
    else if(a==='reset-rewards'){const p=data.players.find(p=>p.id===achievementPlayerId);if(p){p.rewards={...p.rewards,...Object.fromEntries(rewardSlots.map(slot=>[slot,'none']))};refreshAchievementDialog('[data-action="reset-rewards"]','equipped');}}
    else if(a==='preview-victory-pose')previewVictoryPose();
    else if(a==='dismiss-achievement')clearAchievementNotice();
    else if(a==='dart-armory')armoryDialog(b.dataset.id);
    else if(a==='preview-dart')armoryDialog(armoryPlayerId,b.dataset.design);
    else if(a==='equip-dart')equipDart(b.dataset.design);
    else if(a==='match-detail')matchDetail(b.dataset.id);
    else if(a==='delete-match')deleteMatchDialog(b.dataset.id);
    else if(a==='confirm-delete-match')deleteMatch(b.dataset.id);
    else if(a==='return-match'){closeDialog();tab='match';render();}
    else if(a==='rules')rulesDialog();
    else if(a==='export')exportData();
    else if(a==='import')$('#import-file').click();
    else if(a==='confirm-import'&&pendingImport){data=upgradeCurrentMatch(pendingImport);pendingImport=null;precisionMultiplier='S';tab='match';save();closeDialog();render();toast('Backup restored. Welcome back.');}
  });
  document.addEventListener('change',event=>{if(event.target.dataset.rewardSlot)changeRewardSlot(event.target.dataset.rewardSlot,event.target.value);});
  document.addEventListener('change',event=>{const key=event.target.dataset.avatarPart;if(!key||!Object.hasOwn(avatarOptions,key)||!avatarDraft)return;avatarDraft[key]=Number(event.target.value);updateAvatarEditor();});
  document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='new-match-form')startMatch();else if(event.target.id==='player-form')savePlayer(event.target);});
  document.addEventListener('change',event=>{const id=event.target.dataset.playerId;if(id){if(event.target.checked){if(selectedPlayers.length>=8){event.target.checked=false;setupError('Up to 8 players can join a match.');return;}selectedPlayers.push(id);}else selectedPlayers=selectedPlayers.filter(p=>p!==id);const activeId=id;renderChoices();Array.from(document.querySelectorAll('[data-player-id]')).find(el=>el.dataset.playerId===activeId)?.focus();}if(event.target.id==='import-file'){importData(event.target.files[0]);event.target.value='';}});
  document.addEventListener('keydown',event=>{
    if($('#dialog').open){if(event.target.id==='quick-player-name'&&event.key==='Enter'){event.preventDefault();addQuickPlayer();}return;}
    if(tab!=='match')return;
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();undo();return;}
    if(event.ctrlKey||event.metaKey||event.altKey||event.target.matches('input,select,textarea')||event.target.isContentEditable)return;
    if(event.key.toLowerCase()==='m'){event.preventDefault();if(!event.repeat)recordDart('MISS');return;}

    const target=event.target.closest('.board-segment');
    if(target){
      if(['Enter',' '].includes(event.key)){event.preventDefault();if(!event.repeat){const code=target.dataset.code;recordDart(code);Array.from(document.querySelectorAll('.board-segment[data-inner="false"]')).find(el=>el.dataset.code===code)?.focus();}return;}
      if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp','Home','End'].includes(event.key)){
        event.preventDefault();const targets=Array.from(document.querySelectorAll('.board-segment[data-inner="false"]'));
        const direction=['ArrowRight','ArrowDown'].includes(event.key)?1:-1;
        const next=event.key==='Home'?0:event.key==='End'?targets.length-1:(targets.indexOf(target)+direction+targets.length)%targets.length;
        targets.forEach(el=>el.setAttribute('tabindex','-1'));targets[next].setAttribute('tabindex','0');boardFocus=targets[next].dataset.code;targets[next].focus();
      }
      return;
    }
    if(event.key==='Enter'&&event.target===document.body&&current().awaitingNext){event.preventDefault();nextPlayer();}
  });
  // Keep multiple open copies in sync instead of overwriting another tab's visits.
  window.addEventListener('storage',event=>{if(event.key!==STORAGE_KEY||!event.newValue)return;try{const next=JSON.parse(event.newValue);if(validData(next)){data=upgradeCurrentMatch(next);achievementCache=null;precisionMultiplier='S';closeDialog();render();toast('Match updated from another tab.');}}catch(e){/* Preserve the current session on invalid external data. */}});
  document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
  ensureAvatars(data);render();if(loadWarning){updateSaved();toast(loadWarning);}else save();
  </script>
</body>
</html>
