  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script>
  'use strict';

  const STORAGE_KEY='oche.301.v1';
  const icons={
    sound:'<path d="M11 4 5 9H2v6h3l6 5V4Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>',
    mute:'<path d="M11 4 5 9H2v6h3l6 5V4Zm5 5 6 6m0-6-6 6"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',
    board:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    players:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/>',
    history:'<path d="M3 11a9 9 0 1 1 2.5 7M3 4v7h7m2-5v6l4 2"/>',
    undo:'<path d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 0 14" transform="translate(0 -2)"/>',
    backspace:'<path d="M9 5h12v14H9l-7-7 7-7Zm3 4 6 6m0-6-6 6"/>',
    close:'<path d="m6 6 12 12M6 18 18 6"/>',
    check:'<path d="m5 12 4 4L19 6"/>',
    shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>',
    trophy:'<path d="M7 3h10v6a5 5 0 0 1-10 0V3Zm0 2H3v3a5 5 0 0 0 5 5m9-8h4v3a5 5 0 0 1-5 5m-4 1v6m-5 1h10"/>',
    edit:'<path d="m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-5-5L4 14v6Z"/>',
    list:'<path d="M8 6h12M8 12h12M8 18h12M3 6h.01M3 12h.01M3 18h.01"/>',
    dart:'<path d="M4 20 17 7m-4 0 1-5 3 5 5 3-5 1M4 20l2-6 4 4-6 2Z"/>',
    download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>'
  };
  const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.board}</svg>`;
  const $=(selector)=>document.querySelector(selector);
  const esc=(value)=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const initials=name=>name.trim().split(/\s+/).slice(0,2).map(n=>Array.from(n)[0]).join('').toUpperCase();
  const dateLabel=value=>new Date(value).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  let data,tab='match',toastTimer,storageOK=true,pendingImport=null,precisionMultiplier='S',precisionOpen=false,boardFocus='T20',fxTimer,audioContext;
  const singles=Array.from({length:20},(_,i)=>({value:i+1,label:`S${i+1}`,double:false}));
  const doubles=Array.from({length:20},(_,i)=>({value:(i+1)*2,label:`D${i+1}`,double:true}));
  const trebles=Array.from({length:20},(_,i)=>({value:(i+1)*3,label:`T${i+1}`,double:false})).reverse();
  const allHits=[...trebles,...singles.slice().reverse(),...doubles.slice().reverse(),{value:25,label:'25',double:false},{value:50,label:'BULL',double:true}];
  const hitValues=[...new Set([0,...allHits.map(h=>h.value)])];
  const possible=[new Set([0])];
  for(let n=1;n<=3;n++){possible[n]=new Set();for(const a of possible[n-1])for(const b of hitValues)possible[n].add(a+b);}

  const finishCache=new Map();
  function checkout(score,out,maxDarts=3){

    let result=null;
    for(let n=1;n<=maxDarts&&!result;n++){
      function search(left,remaining,path){
        if(remaining===1){const f=finishes.find(h=>h.value===left);return f?[...path,f]:null;}
        for(const hit of allHits){if(left-hit.value<1||(out==='double'&&left-hit.value<2))continue;const found=search(left-hit.value,remaining-1,[...path,hit]);if(found)return found;}

  }
  function makeMatch(players,out='double',bestOf=1){return {id:uid(),startedAt:new Date().toISOString(),players:players.map(p=>({id:p.id,name:p.name})),out,bestOf,finishMode:players.length>2?'placements':'first',visits:[],pending:[],awaitingNext:false,abandoned:false};}
  function freshData(){const players=[{id:uid(),name:'Player 1'},{id:uid(),name:'Player 2'}];const match=makeMatch(players);return {version:1,players,matches:[match],currentId:match.id};}
  function derive(match){
    const count=match.players.length,ranked=count>2&&match.finishMode==='placements';
    let scores=Array(count).fill(301),wins=Array(count).fill(0),turn=0,leg=1,round=1,winner=null,finishOrder=[];
    const stats=match.players.map(()=>({points:0,darts:0,best:0,visits:0})),rows=[],legResults=[];
    const nextEligible=from=>{for(let step=1;step<=count;step++){const candidate=(from+step)%count;if(scores[candidate]>0)return candidate;}return from;};
    for(const visit of match.visits){
      if(winner!==null)break;
      const player=turn,before=scores[player],remaining=before-visit.total;
      const bust=visit.bust||remaining<0||(match.out==='double'&&(remaining===1||(remaining===0&&!visit.double)));
      const credited=bust?0:visit.total;
      scores[player]-=credited;stats[player].points+=credited;stats[player].darts+=visit.darts;stats[player].visits++;stats[player].best=Math.max(stats[player].best,credited);
      const won=scores[player]===0;
      if(won){finishOrder.push(player);if(finishOrder.length===1)wins[player]++;}
      const legFinished=won&&(!ranked||visit.legacyLegEnd===true||finishOrder.length===count-1);
      rows.push({...visit,player,before,remaining:scores[player],credited,bust,won,leg,round,placement:won?finishOrder.length:null,legFinished});
      if(legFinished){
        const legWinner=finishOrder[0],remainingPlayers=scores.map((score,i)=>score>0?i:null).filter(i=>i!==null);
        legResults.push({leg,winner:legWinner,order:[...finishOrder,...remainingPlayers],scores:[...scores],fullPlacements:ranked&&!visit.legacyLegEnd});
        if(wins[legWinner]>=Math.ceil(match.bestOf/2)){winner=legWinner;}
        else{leg++;scores=Array(count).fill(301);finishOrder=[];turn=(leg-1)%count;round=1;}
      }else{
        const next=nextEligible(turn),starter=(leg-1)%count;
        if((next-starter+count)%count<=(turn-starter+count)%count)round++;
        turn=next;
      }
    }
    return {scores,wins,turn,leg,winner,stats,rows,round,ranked,finishOrder,legResults,nextTurn:nextEligible(turn)};
  }
  function validData(value){
    if(!value||value.version!==1||!Array.isArray(value.players)||!Array.isArray(value.matches)||value.players.length>1000||value.matches.length>10000)return false;
    const validName=n=>typeof n==='string'&&n.trim().length>0&&n.length<=32;
    const validId=id=>typeof id==='string'&&id.length>0&&id.length<=100;
    const validPositions=(positions,hits)=>positions===undefined||(Array.isArray(positions)&&Array.isArray(hits)&&positions.length===hits.length&&positions.every(p=>p===null||validBoardPosition(p)));
    if(!value.players.every(p=>p&&validId(p.id)&&validName(p.name))||new Set(value.players.map(p=>p.id)).size!==value.players.length)return false;
    if(!value.matches.every(m=>m&&validId(m.id)&&Number.isFinite(Date.parse(m.startedAt))&&['double','straight'].includes(m.out)&&[1,3,5].includes(m.bestOf)&&typeof m.abandoned==='boolean'&&Array.isArray(m.players)&&m.players.length>=1&&m.players.length<=8&&m.players.every(p=>p&&validId(p.id)&&validName(p.name))&&new Set(m.players.map(p=>p.id)).size===m.players.length&&Array.isArray(m.visits)&&m.visits.length<=100000&&m.visits.every(v=>v&&Number.isInteger(v.total)&&v.total>=0&&v.total<=180&&[1,2,3].includes(v.darts)&&typeof v.bust==='boolean'&&typeof v.double==='boolean'&&(v.bust||possible[v.darts].has(v.total)))))return false;
    if(new Set(value.matches.map(m=>m.id)).size!==value.matches.length||!value.matches.some(m=>m.id===value.currentId&&!m.abandoned))return false;

    for(const m of value.matches){
      if(m.finishMode!==undefined&&!['first','placements'].includes(m.finishMode))return false;
      if(m.visits.some(v=>v.legacyLegEnd!==undefined&&typeof v.legacyLegEnd!=='boolean'))return false;
      if(m.awaitingNext!==undefined&&typeof m.awaitingNext!=='boolean')return false;
      if(m.pending!==undefined&&(!Array.isArray(m.pending)||m.pending.length>2||!m.pending.every(c=>typeof c==='string'&&hitFromCode(c))))return false;

      if(m.awaitingNext&&(!m.visits.length||game.winner!==null))return false;
      if(pending.length&&hitSequence(game.scores[game.turn],pending,m.out).terminalAt!==-1)return false;

        if(row.hits===undefined)continue;
        if(!Array.isArray(row.hits)||row.hits.length!==row.darts||!row.hits.every(c=>typeof c==='string'&&hitFromCode(c)))return false;

  }

  let loadWarning='';

  function updateSaved(){const state=$('#save-state');state.classList.toggle('error',!storageOK);state.innerHTML=`<span class="dot"></span>${storageOK?'Saved on this device':'Not saved · export data'}`;const note=$('.scoring-note');if(note){note.classList.toggle('error',!storageOK);note.innerHTML=`${icon('shield')}${storageOK?'Every dart saved on this device.':'Not saved. Export your data before closing this tab.'}`;}}

  function undo(){
    const m=current();let code,name;
    if(pendingHits(m).length){name=m.players[derive(m).turn].name;m.pendingPositions=positionsFor(m.pending,m.pendingPositions);code=m.pending.pop();m.pendingPositions.pop();}
    else if(m.visits.length){const last=derive(m).rows.at(-1);name=m.players[last.player].name;m.visits.pop();if(last.hits){code=last.hits.at(-1);m.pending=last.hits.slice(0,-1);m.pendingPositions=positionsFor(last.hits,last.positions).slice(0,-1);}else{m.pending=[];m.pendingPositions=[];code=null;}}
    else return toast('No darts to undo yet.');
    m.awaitingNext=false;save();render();toast(`${name}: ${code?hitName(code)+' undone.':'previous total-entry visit undone.'}`);announce('Last dart undone. Score, turn, and match state restored.');
  }
  function animateHit(code,type,total){
    clearTimeout(fxTimer);
    document.querySelectorAll('.board-segment').forEach(el=>{if(el.dataset.code===code)el.classList.add('hit-flash');});
    const hit=hitFromCode(code),special={double:['DOUBLE',`+${hit.value}`,'2 × '+code.slice(1)],triple:['TRIPLE',`+${hit.value}`,'3 × '+code.slice(1)],bull:[code==='BULL'?'BULLSEYE':'OUTER BULL',`+${hit.value}`,code==='BULL'?'DEAD CENTER':'ON TARGET'],checkout:['CHECKED OUT',ordinal(derive(current()).rows.at(-1)?.placement||1),'PLACE SECURED'],'leg-end':['FINAL CHECKOUT','LEG OVER','ALL PLACES DECIDED'],placements:['FINAL CHECKOUT','GAME OVER','STANDINGS COMPLETE'],maximum:['ONE HUNDRED & EIGHTY','180','MAXIMUM'],bust:['BUST','NO SCORE','VISIT RESET'],win:['GAME SHOT','WINNER','MATCH COMPLETE'],leg:['GAME SHOT','LEG WON','NEXT LEG READY'],miss:['MISS','0','NEXT DART'],single:['SINGLE',`+${hit.value}`,'KEEP IT GOING']}[type];
    playHitSound(type==='checkout'||type==='leg-end'?'leg':type==='placements'?'win':type);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const host=$('#fx-host');if(!host)return;
    const callout=$('.board-turn-callout');if(callout)callout.style.visibility='hidden';
    host.innerHTML=`<div class="arcade-fx ${type}"><div class="fx-aura"></div><i class="fx-ring"></i>${type==='bull'?'<i class="fx-ring"></i>':''}${!['single','miss'].includes(type)?Array.from({length:18},(_,i)=>`<i class="fx-spark" style="--angle:${i*20}deg;--delay:${i%3*.02}s"></i>`).join(''):''}<div class="fx-caption"><small>${special[0]}</small><strong>${special[1]}</strong><span>${special[2]}</span></div></div>`;
    if(!['single','miss'].includes(type))$('.board-stage')?.classList.add('impact');
    fxTimer=setTimeout(()=>{host.innerHTML='';$('.board-stage')?.classList.remove('impact');if(callout)callout.style.visibility='';},1100);
  }
  function playHitSound(type){
    if(!data.settings?.sound)return;
    try{
      audioContext ||= new (window.AudioContext||window.webkitAudioContext)();
      if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
      const notes={single:[320],miss:[110],double:[440,660],triple:[440,660,880],bull:[523,659,784,1047],maximum:[523,659,784,1047,1319],win:[523,659,784,1047,1319],leg:[523,659,784,1047],bust:[180,130,80]}[type]||[330];
      notes.forEach((frequency,i)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain(),at=audioContext.currentTime+i*.075;osc.type=type==='bust'?'sawtooth':'triangle';osc.frequency.setValueAtTime(frequency,at);gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.09,at+.008);gain.gain.exponentialRampToValueAtTime(.001,at+.18);osc.connect(gain);gain.connect(audioContext.destination);osc.start(at);osc.stop(at+.2);});
    }catch(e){/* Visual feedback remains available without Web Audio. */}
  }
  function updateSound(){const b=$('[data-action="sound"]');if(!b)return;const on=!!data.settings?.sound;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',`Turn arcade sound ${on?'off':'on'}`);b.innerHTML=`${icon(on?'sound':'mute')}<span>Sound ${on?'on':'off'}</span>`;}
  function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('div');c.className='confetti';c.setAttribute('aria-hidden','true');c.innerHTML=Array.from({length:40},()=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.4}s;transform:rotate(${Math.random()*180}deg)"></i>`).join('');document.body.append(c);setTimeout(()=>c.remove(),3100);}
  let dialogFocus=null;
  function openDialog(title,body){const dialog=$('#dialog');if(!dialog.open)dialogFocus=document.activeElement;dialog.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="icon-btn" data-action="close-dialog" aria-label="Close dialog">${icon('close')}</button></div><div class="dialog-body">${body}</div>`;if(!dialog.open)dialog.showModal();}
  function closeDialog(){if($('#dialog').open){$('#dialog').close();if(dialogFocus?.isConnected)dialogFocus.focus();}}
  let selectedPlayers=[];
  function newMatchDialog(rematch=false){
    const m=current(),g=derive(m);selectedPlayers=m.players.map(p=>p.id).filter(id=>data.players.some(p=>p.id===id));if(!selectedPlayers.length)selectedPlayers=data.players.slice(0,2).map(p=>p.id);
    openDialog(rematch?'Run it back.':'Set up your match',`<p>Start at 301. Take turns. Make every dart count.</p><form id="new-match-form"><div class="field"><span class="field-label">Players <span class="muted" style="font-weight:400">· choose 1–8 in throwing order</span></span><div id="player-choices" class="player-choices"></div><div class="inline-add"><input class="text-input" id="quick-player-name" aria-label="New player name" placeholder="Add a new player…" maxlength="32"><button type="button" class="btn" data-action="quick-add-player" aria-label="Add player">${icon('plus')}</button></div><p id="setup-error" class="input-error" role="alert" hidden></p></div><div class="form-row"><div class="field"><label for="out-rule">Finish rule</label><select class="select-input" id="out-rule"><option value="double" ${m.out==='double'?'selected':''}>Double out</option><option value="straight" ${m.out==='straight'?'selected':''}>Straight out</option></select></div><div class="field"><label for="best-of">Match length</label><select class="select-input" id="best-of">${[1,3,5].map(n=>`<option value="${n}" ${m.bestOf===n?'selected':''}>${n===1?'Single leg':`First to ${Math.ceil(n/2)} legs`}</option>`).join('')}</select></div></div><div class="dialog-info">${g.winner===null&&(m.visits.length||pendingHits(m).length)?'Your current match will be saved as ended early. ':''}Each player starts at 301. With 3–8 players, checked-out players skip their turns; each leg continues until only one player is left. The first checkout wins the leg.</div><div class="dialog-actions"><button type="button" class="btn" data-action="close-dialog">Cancel</button><button class="btn primary" type="submit">Let’s play ${icon('arrow')}</button></div></form>`);renderChoices();
  }
  function renderChoices(){const box=$('#player-choices');if(!box)return;box.innerHTML=data.players.map(p=>`<label class="player-choice"><input type="checkbox" data-player-id="${esc(p.id)}" ${selectedPlayers.includes(p.id)?'checked':''}><span>${esc(p.name)}</span><span class="order">${selectedPlayers.includes(p.id)?`Throws ${selectedPlayers.indexOf(p.id)+1}`:''}</span></label>`).join('')||'<p class="muted" style="font-size:12px">Add a player below to start.</p>';}
  function setupError(message){$('#setup-error').textContent=message;$('#setup-error').hidden=false;}
  function addQuickPlayer(){const field=$('#quick-player-name'),name=field.value.trim();if(!name)return setupError('Give your player a name.');if(data.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))return setupError('That player already exists. Select them above.');const p={id:uid(),name};data.players.push(p);if(selectedPlayers.length<8)selectedPlayers.push(p.id);field.value='';$('#setup-error').hidden=true;save();renderChoices();}
  function startMatch(){if(!selectedPlayers.length||selectedPlayers.length>8)return setupError('Choose between 1 and 8 players.');const old=current();if((old.visits.length||pendingHits(old).length)&&derive(old).winner===null)old.abandoned=true;if(!old.visits.length&&!pendingHits(old).length)data.matches=data.matches.filter(m=>m.id!==old.id);const match=makeMatch(selectedPlayers.map(id=>data.players.find(p=>p.id===id)),$('#out-rule').value,Number($('#best-of').value));data.matches.push(match);data.currentId=match.id;precisionMultiplier='S';tab='match';save();closeDialog();render();toast('Match on. Good darts.');}
  function playerDialog(id){const p=data.players.find(p=>p.id===id);openDialog(p?'Edit player':'Meet your next regular',`<p>${p?'Player statistics stay with this profile when you change the name.':'Add a name. We’ll keep their scores and statistics here.'}</p><form id="player-form" data-id="${esc(id||'')}"><div class="field"><label for="player-name">Player name</label><input class="text-input" id="player-name" maxlength="32" required autocomplete="off" value="${p?esc(p.name):''}" placeholder="e.g. Jamie" autofocus><p id="player-error" class="input-error" role="alert" hidden></p></div><div class="dialog-actions">${p?'<button type="button" class="btn danger" data-action="remove-player" data-id="'+esc(p.id)+'">Remove player</button>':'<button type="button" class="btn" data-action="close-dialog">Cancel</button>'}<button type="submit" class="btn primary">${p?'Save changes':'Add player'}</button></div></form>`);$('#player-name').focus();}
  function savePlayer(form){const name=$('#player-name').value.trim(),id=form.dataset.id;if(!name||data.players.some(p=>p.id!==id&&p.name.toLowerCase()===name.toLowerCase())){const error=$('#player-error');error.textContent=name?'A player with this name already exists.':'Enter a player name.';error.hidden=false;return;}const p=data.players.find(p=>p.id===id);if(p){p.name=name;const m=current();if(derive(m).winner===null)m.players.filter(p=>p.id===id).forEach(p=>p.name=name);}else data.players.push({id:uid(),name});save();closeDialog();render();toast(p?'Player updated.':'Player added.');}
  function removePlayerDialog(id){const p=data.players.find(p=>p.id===id);openDialog('Remove player?',`<p>Remove <strong>${esc(p.name)}</strong> from your player list? Their saved matches and current game will stay intact.</p><div class="dialog-actions"><button class="btn" data-action="close-dialog">Keep player</button><button class="btn danger" data-action="confirm-remove" data-id="${esc(id)}">Remove player</button></div>`);}
  function matchDetail(id){const m=data.matches.find(m=>m.id===id),g=derive(m);openDialog('Match record',`<p>${esc(dateLabel(m.startedAt))} · 301 · ${m.out==='double'?'Double':'Straight'} out · ${m.bestOf===1?'Single leg':`First to ${Math.ceil(m.bestOf/2)} legs`}</p><div class="dialog-info" style="margin-bottom:22px">${g.winner!==null?`${esc(m.players[g.winner].name)} won the match`:m.abandoned?'Ended early':'Match in progress'}<br>${m.players.map((p,i)=>`${esc(p.name)}: ${g.wins[i]} leg${g.wins[i]===1?'':'s'}`).join(' · ')}</div>${g.ranked?g.legResults.map(result=>rankingsMarkup(m,result)).join(''):''}${visitsTable(m,historyRows(m),Infinity)}<div class="dialog-actions"><button class="btn" data-action="close-dialog">Close</button>${id===data.currentId?'<button class="btn primary" data-action="return-match">Go to match</button>':''}</div>`);}

  function rulesDialog(){openDialog('301. Now every dart counts.',`<p>Start at 301 and tap the segment each dart hit. The first player to reach exactly zero wins the leg.</p><ul class="rule-list"><li><strong>Tap the board:</strong> the wide areas score the number shown. The outer narrow ring doubles it; the inner narrow ring triples it. Outer bull scores 25; bullseye scores 50.</li><li><strong>Three darts per visit:</strong> each tap is saved immediately. After the third dart, select Next player. A miss scores zero and uses one dart. End visit early records only the darts you threw.</li><li><strong>Double out:</strong> finish on a double or the bullseye. A single or triple reaching zero is a bust. Straight out allows any scoring segment.</li><li><strong>Bust:</strong> going below zero or leaving 1 in double out resets the whole visit. The board pauses so you can pass to the next player.</li><li><strong>Undo dart:</strong> removes one dart and restores the turn, score, leg, and statistics, even after a bust, checkout, or win. Older total-entry records undo as a whole visit.</li><li><strong>Precision entry:</strong> use the larger number buttons below the board, with Single, Double, or Triple selected. On the board, arrow keys select segments; Enter or Space records the focused segment. Ctrl/⌘ Z undoes.</li><li><strong>Three to eight players:</strong> the first checkout wins the leg, then play continues for the remaining places. Checked-out players are skipped. The leg ends when only one player has not checked out. In a multi-leg match, the next leg starts after places are decided. The opening player rotates between legs.</li></ul><div class="dialog-info">Every dart, including an unfinished visit, is saved in this browser. Keep the HTML file in the same location. Export a backup before clearing browser data or switching devices. Averages use actual darts thrown; bust visits score zero. Arcade sound is optional, and reduced-motion settings are respected.</div><div class="dialog-actions"><button class="btn primary" data-action="close-dialog">Back to the board ${icon('arrow')}</button></div>`);}
  function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`oche-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported. Keep it for your next device.');}
  async function importData(file){if(!file)return;if(file.size>15000000)return toast('This file is too large. Choose an OCHE backup under 15 MB.');try{const value=JSON.parse(await file.text());if(!validData(value))throw new Error('Invalid backup');pendingImport=value;openDialog('Restore your backup?',`<p>This backup contains <strong>${value.players.length} players</strong> and <strong>${value.matches.length} matches</strong>. Restoring replaces the players and matches on this device.</p><div class="dialog-info">Export your current data first if you want to keep a separate copy.</div><div class="dialog-actions"><button class="btn" data-action="export">Export current</button><button class="btn primary" data-action="confirm-import">Restore backup</button></div>`);}catch(e){toast('That file is not a valid OCHE backup. Your data is unchanged.');}}
  document.addEventListener('click',event=>{
    const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
    if(a==='tab'){tab=b.dataset.tab;render();}

    else if(a==='hit')recordDart(b.dataset.code,boardClickPosition(event,b));
    else if(a==='multiplier'){precisionMultiplier=b.dataset.value;precisionOpen=true;render();}
    else if(a==='next-player')nextPlayer();
    else if(a==='end-visit')endVisit();
    else if(a==='undo')undo();
    else if(a==='sound'){data.settings={...data.settings,sound:!data.settings?.sound};save();updateSound();if(data.settings.sound)playHitSound('double');}
    else if(a==='new-match'||a==='rematch')newMatchDialog(a==='rematch');
    else if(a==='close-dialog')closeDialog();
    else if(a==='quick-add-player')addQuickPlayer();
    else if(a==='add-player')playerDialog();
    else if(a==='edit-player')playerDialog(b.dataset.id);
    else if(a==='remove-player')removePlayerDialog(b.dataset.id);
    else if(a==='confirm-remove'){data.players=data.players.filter(p=>p.id!==b.dataset.id);save();closeDialog();render();toast('Player removed. Match records kept.');}
    else if(a==='match-detail')matchDetail(b.dataset.id);
    else if(a==='return-match'){closeDialog();tab='match';render();}
    else if(a==='rules')rulesDialog();
    else if(a==='export')exportData();
    else if(a==='import')$('#import-file').click();
    else if(a==='confirm-import'&&pendingImport){data=upgradeCurrentMatch(pendingImport);pendingImport=null;precisionMultiplier='S';tab='match';save();closeDialog();render();toast('Backup restored. Welcome back.');}
  });
  document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='new-match-form')startMatch();else if(event.target.id==='player-form')savePlayer(event.target);});
  document.addEventListener('change',event=>{const id=event.target.dataset.playerId;if(id){if(event.target.checked){if(selectedPlayers.length>=8){event.target.checked=false;setupError('Up to 8 players can join a match.');return;}selectedPlayers.push(id);}else selectedPlayers=selectedPlayers.filter(p=>p!==id);const activeId=id;renderChoices();Array.from(document.querySelectorAll('[data-player-id]')).find(el=>el.dataset.playerId===activeId)?.focus();}if(event.target.id==='import-file'){importData(event.target.files[0]);event.target.value='';}});
  document.addEventListener('keydown',event=>{
    if($('#dialog').open){if(event.target.id==='quick-player-name'&&event.key==='Enter'){event.preventDefault();addQuickPlayer();}return;}
    if(tab!=='match')return;
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();undo();return;}
    if(event.ctrlKey||event.metaKey||event.altKey||event.target.matches('input,select,textarea'))return;

    const target=event.target.closest('.board-segment');
    if(target){
      if(['Enter',' '].includes(event.key)){event.preventDefault();if(!event.repeat){const code=target.dataset.code;recordDart(code);Array.from(document.querySelectorAll('.board-segment[data-inner="false"]')).find(el=>el.dataset.code===code)?.focus();}return;}
      if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp','Home','End'].includes(event.key)){
        event.preventDefault();const targets=Array.from(document.querySelectorAll('.board-segment[data-inner="false"]'));
        const direction=['ArrowRight','ArrowDown'].includes(event.key)?1:-1;
        const next=event.key==='Home'?0:event.key==='End'?targets.length-1:(targets.indexOf(target)+direction+targets.length)%targets.length;
        targets.forEach(el=>el.setAttribute('tabindex','-1'));targets[next].setAttribute('tabindex','0');boardFocus=targets[next].dataset.code;targets[next].focus();
      }
      return;
    }
    if(event.key==='Enter'&&event.target===document.body&&current().awaitingNext){event.preventDefault();nextPlayer();}
  });
  // Keep multiple open copies in sync instead of overwriting another tab's visits.
  window.addEventListener('storage',event=>{if(event.key!==STORAGE_KEY||!event.newValue)return;try{const next=JSON.parse(event.newValue);if(validData(next)){data=upgradeCurrentMatch(next);precisionMultiplier='S';closeDialog();render();toast('Match updated from another tab.');}}catch(e){/* Preserve the current session on invalid external data. */}});
  document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
  render();if(loadWarning){updateSaved();toast(loadWarning);}else save();
  </script>
</body>
